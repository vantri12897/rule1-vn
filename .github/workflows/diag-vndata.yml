name: Chẩn đoán vndata

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests pandas
      - run: python -u tools/diag_vndata.py
