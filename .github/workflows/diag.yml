name: Khảo sát dữ liệu (phát triển)
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Mã cách nhau bằng dấu cách"
        default: "FPT VCB PNJ DGC HPG"
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai pandas
      - run: python tools/diag_vci.py ${{ github.event.inputs.symbols }} || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag
          git commit -qm "Khảo sát dữ liệu VCI" || exit 0
          git pull -q --rebase --autostash && git push -q
