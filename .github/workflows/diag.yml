name: Khảo sát (tạm)
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -q -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai pandas
      - run: mkdir -p diag && python tools/diag_ins.py FPT HPG VCG > diag/ins.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag/ins.txt; git commit -qm "Khảo sát giao dịch nội bộ" || exit 0; git pull -q --rebase && git push -q
