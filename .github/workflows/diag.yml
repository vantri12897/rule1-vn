name: Kiểm tra nâng cấp (tạm)
on: {workflow_dispatch: {}}
jobs:
  up:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -c "import sys;print(sys.version)"; echo hello > part_X.csv
      - uses: actions/upload-artifact@v7
        with: {name: part-X, path: part_X.csv, retention-days: 1}
  down:
    needs: up
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with: {path: parts, merge-multiple: true}
      - run: ls -la parts && cat parts/part_X.csv
