name: Cập nhật BCTC

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Chạy thử vài mã, cách nhau bằng dấu cách (để trống = cập nhật toàn bộ 3 sàn)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fundamentals
  cancel-in-progress: false

jobs:
  test:
    if: github.event.inputs.symbols != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai pandas
      - run: |
          mkdir -p diag
          python -u vn_rule1_export.py --symbols ${{ github.event.inputs.symbols }} --out diag/test_data.csv --cache /tmp/c --sleep 0.5 --refresh || true
          [ -f rule1_errors.csv ] && mv rule1_errors.csv diag/test_errors.csv || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag
          git commit -qm "Chạy thử BCTC: ${{ github.event.inputs.symbols }}" || exit 0
          git pull -q --rebase --autostash && git push -q

  fetch:
    if: github.event.inputs.symbols == ''
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        exchange: [HOSE, HNX, UPCOM]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai pandas
      - name: Lấy BCTC sàn ${{ matrix.exchange }}
        run: |
          python -u vn_rule1_export.py --exchanges ${{ matrix.exchange }} --out part_${{ matrix.exchange }}.csv --cache cache --sleep 0.5 --refresh
          [ -f rule1_errors.csv ] && mv rule1_errors.csv errors_${{ matrix.exchange }}.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-${{ matrix.exchange }}
          path: |
            part_${{ matrix.exchange }}.csv
            errors_${{ matrix.exchange }}.csv
          if-no-files-found: ignore
          retention-days: 7

  merge:
    needs: fetch
    if: always() && github.event.inputs.symbols == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
      - name: Gộp và kiểm tra
        id: merge
        continue-on-error: true
        run: python tools/merge_fundamentals.py parts
      - name: Lưu vào repo
        run: |
          mkdir -p diag && cp parts/errors_*.csv diag/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rule1_data.csv fundamentals_meta.json diag || true
          git commit -qm "Cập nhật BCTC $(TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%d')" || exit 0
          git pull -q --rebase --autostash && git push -q
      - name: Báo lỗi nếu có sàn giữ dữ liệu cũ
        if: steps.merge.outcome == 'failure'
        run: |
          echo "::error::Có sàn không cập nhật được BCTC, đã giữ dữ liệu cũ của sàn đó. Xem fundamentals_meta.json."
          exit 1
