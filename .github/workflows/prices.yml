name: Cập nhật giá hàng ngày

on:
  schedule:
    # 09:30 UTC = 16:30 giờ Việt Nam, thứ Hai đến thứ Sáu (sau khi thị trường đóng cửa 15:00)
    - cron: "30 9 * * 1-5"
  workflow_dispatch:      # cho phép bấm "Run workflow" để chạy tay
    inputs:
      symbols:
        description: "Chỉ cập nhật vài mã, cách nhau bằng dấu cách (để trống = toàn bộ)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cài vnstock
        run: |
          python -m pip install --upgrade pip
          pip install -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai pandas

      - name: Lấy dữ liệu nến hiện có (nhánh charts-data)
        run: git clone -q --depth 1 -b charts-data "https://github.com/${{ github.repository }}.git" charts_out || mkdir -p charts_out

      - name: Lấy giá đóng cửa
        id: run
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SYMS="${{ github.event.inputs.symbols }}"
          python -u update_prices.py --charts-dir charts_out ${SYMS:+--symbols $SYMS} &
          PID=$!
          # Lưu tiến độ lên repo mỗi 10 phút để theo dõi được và không mất phần đã lấy
          while kill -0 $PID 2>/dev/null; do
            for _ in $(seq 60); do kill -0 $PID 2>/dev/null || break; sleep 10; done
            if kill -0 $PID 2>/dev/null && [ -f prices.json ]; then
              git add prices.json
              git diff --cached --quiet || { git commit -qm "Cập nhật giá (đang chạy)" && { git pull -q --rebase -X theirs --autostash || git rebase --abort; } && git push -q || true; }
            fi
          done
          wait $PID

      - name: Lưu prices.json vào repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json || true
          if git diff --cached --quiet; then
            echo "Không có thay đổi giá."
          else
            git commit -m "Cập nhật giá $(TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%d %H:%M')"
            # Thử lại tối đa 3 lần; khi xung đột ở prices.json thì giữ bản mới vừa tính (-X theirs)
            for i in 1 2 3; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase -X theirs --autostash && git push; then exit 0; fi
              sleep 10
            done
            exit 1
          fi

      - name: Lưu dữ liệu nến (nhánh charts-data, chỉ giữ bản mới nhất)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(ls charts_out/*.json 2>/dev/null | wc -l)
          if [ "$n" -eq 0 ]; then echo "Không có dữ liệu nến."; exit 0; fi
          cd charts_out && rm -rf .git
          TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%dT%H:%M+07:00' > _updated.txt
          git init -q -b charts-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Dữ liệu nến $(cat _updated.txt) ($n mã)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" charts-data
          echo "Đã lưu dữ liệu nến cho $n mã"

      - name: Báo lỗi nếu lấy giá thất bại
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::Lấy giá thất bại hoặc dưới 50% mã cập nhật được. Website vẫn giữ giá của lần thành công gần nhất."
          exit 1
