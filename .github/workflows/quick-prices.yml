name: Giá đóng cửa nhanh

on:
  schedule:
    # 08:07 UTC = 15:07 giờ VN và 08:41 UTC = 15:41 (dự phòng), thứ Hai–thứ Sáu.
    # Chỉ lấy giá đóng cửa (bảng giá, ~1 phút). Nến và chỉ báo do workflow "Cập nhật giá hàng ngày" tính sau.
    - cron: "7 8 * * 1-5"
    - cron: "41 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quick-prices
  cancel-in-progress: false

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cài vnstock
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -U --extra-index-url https://vnstocks.com/api/simple vnstock vnai pandas
      - name: Lấy giá đóng cửa phiên hôm nay
        run: python -u tools/quick_prices.py
      - name: Lưu prices.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then echo "Không có thay đổi."; exit 0; fi
          git commit -m "Giá đóng cửa nhanh $(TZ=Asia/Ho_Chi_Minh date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs --autostash && git push; then exit 0; fi
            sleep 10
          done
          exit 1
